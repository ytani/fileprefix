<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>file prefix</title>
<style>
  :root { --bg:#ffffff; --fg:#1a1a1a; --sub:#aaaaaa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#f0f0f0; --sub:#5f6672; }
  }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #prefix {
    font-family:ui-monospace, Consolas, monospace;
    font-size:clamp(2rem, 10vw, 4rem);
  }
  #note {
    color:var(--sub); font-size:0.7rem; line-height:1.6;
    margin-top:40px; padding:0 24px; max-width:32rem;
  }
  #note p { margin:0; }
</style>
</head>
<body>
<div id="prefix"></div>
<div id="note">
  <p>命名ルール: [年][月日][時間帯]_</p>
  <p>年: 1文字。2026=A、2027=B、2028=C …</p>
  <p>月日: MMDD の4桁。例: 11月8日 → 1108</p>
  <p>時間帯: 1文字。10時より前=a、10:00〜10:29=b、10:30〜10:59=c … と30分ごとに1文字進み、21:30〜21:59=y、22時以降=z</p>
  <p>末尾: アンダースコア _</p>
</div>
<script>
function yearLetter(y) {
  return String.fromCharCode("A".charCodeAt(0) + (y - 2026));
}
function hourCode(h, m) {
  if (h < 10) return "a";
  const slot = (h - 10) * 2 + Math.floor(m / 30);
  if (slot >= 24) return "z";
  return String.fromCharCode("b".charCodeAt(0) + slot);
}
function build(now) {
  const pad = n => String(n).padStart(2, "0");
  return yearLetter(now.getFullYear())
    + pad(now.getMonth() + 1) + pad(now.getDate())
    + hourCode(now.getHours(), now.getMinutes()) + "_";
}
const el = document.getElementById("prefix");
function render() {
  const s = build(new Date());
  if (el.textContent !== s) el.textContent = s;
}
render();
setInterval(render, 1000);
</script>
</body>
</html>
